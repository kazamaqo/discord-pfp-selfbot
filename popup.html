<!DOCTYPE html>
<html>
<head>
    <title>Discord Token Extractor</title>
    <style>
        body {
            width: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #36393f;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .container {
            background: #2f3136;
            border-radius: 8px;
            padding: 15px;
        }
        h1 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #7289da;
            text-align: center;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #b9bbbe;
            margin-bottom: 4px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #202225;
            border-radius: 4px;
            background: #40444b;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 12px;
        }
        input::placeholder {
            color: #72767d;
        }
        input:focus {
            outline: none;
            border-color: #7289da;
            background: #40444b;
        }
        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #extractBtn {
            background: #7289da;
            color: white;
        }
        #extractBtn:hover {
            background: #5a73c4;
        }
        #sendBtn {
            background: #43b581;
            color: white;
        }
        #sendBtn:hover {
            background: #3ca374;
        }
        #sendBtn:disabled {
            background: #72767d;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            min-height: 20px;
            display: none;
        }
        .status.loading {
            display: block;
            background: #40444b;
            color: #faa61a;
        }
        .status.success {
            display: block;
            background: #40444b;
            color: #43b581;
        }
        .status.error {
            display: block;
            background: #40444b;
            color: #f04747;
        }
        .info {
            font-size: 11px;
            color: #72767d;
            background: #40444b;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Token Extractor</h1>
        
        <div class="info">
            ✓ Open Discord in another tab<br>
            ✓ Click "Extract Token"<br>
            ✓ Enter bot URL<br>
            ✓ Click "Send to Bot"
        </div>

        <div class="form-group">
            <label for="tokenInput">Discord Token:</label>
            <input type="password" id="tokenInput" placeholder="Token will appear here" readonly>
        </div>

        <div class="form-group">
            <label for="botUrl">Bot URL:</label>
            <input type="text" id="botUrl" placeholder="https://discord-pfp-selfbot-h.up.railway.app">
        </div>

        <div class="button-group">
            <button id="extractBtn">🔍 Extract Token</button>
            <button id="sendBtn">📤 Send to Bot</button>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
